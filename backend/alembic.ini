[alembic]
script_location = alembic
# No sqlalchemy.url on purpose: the URL always comes from app.config.Settings
# (i.e. WEBGIS_DATABASE_URL). Alembic reads this file with encoding="locale",
# so keep it ASCII -- a non-ASCII byte here crashes the CLI on Windows.
#
# This file used to hardcode sqlite:///./catalog.db, which meant migrations and
# the application silently talked to two different databases.

[loggers]
keys = root
handlers =
level = WARN

[logger_root]
level = WARN
handlers =