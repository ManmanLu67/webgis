id: arcgis_wayback
name: 历史版本
version: 0.1.0
mode: reference
capabilities: [search, temporal]
credentials: []
license_note: "待确认：以 Esri Wayback 官方使用条款为准。只登记清单里已给出的瓦片地址，不另存瓦片。"
cache_allowed: false
status: implemented
availability: ready
drape: true
picker: time
# 这个源的"时间"其实是"历史版本"，挑版本正是它存在的意义，
# 所以要给一个可选列表，而不是只给最近一条。
time_choices: list
catalog_url: https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json
entrypoint: provider:WaybackProvider
